; PlatformIO Project Configuration File
;
; Firmware de testes da IHM para ESP32-S3-WROOM-1-N8.
; A board esp32-s3-devkitc-1 corresponde ao modulo ESP32-S3 N8 sem PSRAM.
;
; Ajustes comuns:
; - SSID/senha e broker MQTT padrao: include/app_config.h
; - Certificado CA MQTT TLS: include/certs.h
; - Porta serial de upload: upload_port
; - Velocidade do monitor: monitor_speed
; - Particoes: partitions.csv ja registrado em board_build.partitions

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
upload_protocol = esptool
board_build.partitions = partitions.csv
board_build.flash_size = 8MB
monitor_speed = 115200
upload_speed = 57600
upload_port = COM3
board_build.mcu = esp32s3




